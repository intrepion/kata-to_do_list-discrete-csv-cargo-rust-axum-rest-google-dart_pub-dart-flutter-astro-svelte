name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build and run all Rust targets
        run: cargo +stable test --manifest-path server/Cargo.toml --all-targets
  landing:
    name: Astro production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
  flutter:
    name: Flutter analyze, widget test and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          # Matches client/.metadata revision 058e0af (Flutter 3.44.8).
          flutter-version: '3.44.8'
          channel: stable
          cache: false
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
